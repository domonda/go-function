# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: '1.26.5'

    # Every step below used to pipe `go list -m` straight into xargs. When that
    # listing failed the pipeline still exited 0, xargs got empty input, and the
    # job passed green without having checked a single package -- which is what
    # happened once go.work required a newer Go than this workflow set up. Write
    # the list out once so a failure here stops the job.
    - name: List modules
      run: |
        go list -f '{{.Dir}}' -m | tee module-dirs
        test -s module-dirs

    - name: Build
      run: xargs -I {} go build {}/... < module-dirs

    # The tools module holds only a `tool` directive and no packages of its own.
    # `go vet`, `go test` and gosec all treat a pattern that matches no packages
    # as an error, so check only the modules that have something to look at.
    - name: Vet
      run: |
        while read -r dir; do
          [ -n "$(go list "$dir/..." 2>/dev/null)" ] || continue
          go vet "$dir/..."
        done < module-dirs

    - name: Test
      run: |
        while read -r dir; do
          [ -n "$(go list "$dir/..." 2>/dev/null)" ] || continue
          go test -count=1 -v "$dir/..."
        done < module-dirs

    - name: Gosec
      run: |
        while read -r dir; do
          [ -n "$(go list "$dir/..." 2>/dev/null)" ] || continue
          go tool gosec "$dir/..."
        done < module-dirs
